# Install as /etc/dnsmasq.d/wlan0-ap.conf. DHCP/DNS for the hostapd AP on
# wlan0 only. bind-interfaces + interface= together are required --
# interface= alone still lets dnsmasq's DHCP socket listen on 0.0.0.0:67,
# which would let it see and potentially answer DHCP broadcasts from
# whatever other network the Pi's Ethernet uplink is on. Scoping this
# tightly matters: that's someone else's network, not ours to serve DHCP on.
#
# Requires conf-dir=/etc/dnsmasq.d/,*.conf uncommented in /etc/dnsmasq.conf.
interface=wlan0
bind-interfaces
except-interface=lo
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h
domain=sar.local
address=/sar-pi.sar.local/192.168.4.1
