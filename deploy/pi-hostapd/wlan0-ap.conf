# Install as /etc/dnsmasq.d/wlan0-ap.conf. DHCP/DNS for the hostapd AP on
# wlan0 only.
#
# bind-dynamic (NOT bind-interfaces): bind-interfaces binds to wlan0's address
# once, AT STARTUP, and fails to serve DHCP if dnsmasq happens to start before
# systemd-networkd has put 192.168.4.1 on wlan0 (the boot-order race that makes
# clients associate but never get an IP). bind-dynamic instead attaches to
# wlan0 as it appears (and only to the interfaces named here -- it does NOT
# listen on 0.0.0.0, so it still won't leak DHCP onto the Ethernet uplink),
# which is race-proof across reboots.
#
# Requires conf-dir=/etc/dnsmasq.d/,*.conf uncommented in /etc/dnsmasq.conf.
interface=wlan0
bind-dynamic
except-interface=lo
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h
domain=sar.local
address=/sar-pi.sar.local/192.168.4.1
