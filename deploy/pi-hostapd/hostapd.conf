# Access point on the Raspberry Pi's onboard WiFi (wlan0) for direct field
# access to the ground-station UI/SSH without needing existing WiFi
# infrastructure.
#
# 5GHz (hw_mode=a, channel 36) on purpose: the RF scanners listen on the
# 2.4GHz ISM band (BLE and WiFi -- our primary signals), so hosting the AP
# there would transmit into the very band we're trying to hear and raise the
# noise floor near the Pi. Channel 36 is U-NII-1 (non-DFS), so it starts
# without radar-detection delays. country_code + ieee80211d are required for
# the driver to enable 5GHz at all. Nearly all client devices support 5GHz;
# range/wall penetration is shorter than 2.4GHz but fine for line-of-sight
# field use at the launch point.
#
# CHANGE wpa_passphrase before deploying -- this is a template, not a live
# config. Generate one with: openssl rand -base64 12 | tr -d '/+=' | head -c 16
interface=wlan0
driver=nl80211
ssid=SARfly
hw_mode=a
channel=36
country_code=US
ieee80211d=1
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=CHANGE_ME_PASSPHRASE
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
