<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLE SAR Ground Station</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121922;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4da3ff;
    --known: #2ecc71;
    --unknown: #ff5555;
    --ignore: #6b7280;
    --border: #22303c;
  }
  html.night {
    --bg: #000000;
    --panel: #0a0000;
    --text: #ff5c5c;
    --muted: #7a2222;
    --accent: #ff5c5c;
    --known: #7a3a3a;
    --unknown: #ff2222;
    --ignore: #552222;
    --border: #330000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--unknown); display: inline-block;
  }
  .dot.connected { background: var(--known); }
  button, .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    text-decoration: none;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #search {
    margin-left: auto;
  }
  #search input {
    width: 220px;
  }
  main {
    display: flex;
    flex-wrap: wrap;
    gap: 1px;
    background: var(--border);
  }
  #map-panel, #table-panel {
    background: var(--bg);
    flex: 1 1 480px;
    min-width: 320px;
  }
  #map-panel { padding: 12px; }
  #map {
    width: 100%; height: 60vh; background: var(--panel); border-radius: 8px;
  }
  .leaflet-container { background: var(--panel); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
  .leaflet-control-zoom a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--border) !important; }
  #table-panel { padding: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th.sortable .arrow { display: inline-block; width: 1em; opacity: 0.6; }
  tr.row-unknown { background: color-mix(in srgb, var(--unknown) 12%, transparent); }
  tr.row-highlight { outline: 1px solid var(--accent); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    font-weight: 600; color: #04140a;
  }
  .badge.known { background: var(--known); }
  .badge.unknown { background: var(--unknown); color: #200000; }
  .badge.ignore { background: var(--ignore); color: #eee; }
  .badge.vendor {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
  }
  .badge.vendor.medium { opacity: 0.65; }
  input[type=text], input[type=number] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 4px 6px; font-size: 12px; width: 130px;
  }
  input[type=number] { width: 80px; }
  #mission-panel {
    margin-top: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
  }
  .mission-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .mission-row + .mission-row { margin-top: 8px; }
  .mission-row label { flex-direction: row; gap: 6px; }
  #mission-spacing-auto { padding: 2px 8px; font-size: 11px; }
  select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 4px; font-size: 12px;
  }
  .muted { color: var(--muted); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span class="dot" id="conn-dot"></span>
  <h1>BLE SAR Ground Station</h1>
  <label><input type="checkbox" id="filter-new"> Show only untagged</label>
  <label><input type="checkbox" id="show-heatmap"> Hit density heatmap</label>
  <button id="night-toggle">Night mode</button>
  <a class="btn" href="/api/kmz">Export KMZ</a>
  <button id="bulk-known" title="Tag every currently visible device as known">Mark all known</button>
  <button id="bulk-ignore" title="Tag every currently visible device as ignore">Ignore all</button>
  <button id="reset-db" title="Delete ALL detections and tags">Reset Database</button>
  <span id="search"><input type="text" id="search-input" placeholder="Search MAC / name / label"></span>
</header>
<main>
  <div id="map-panel">
    <div id="map"></div>
    <p class="muted" id="map-caption"></p>
    <div id="mission-panel">
      <div class="mission-row">
        <button id="draw-box-btn">Draw search box</button>
        <button id="clear-box-btn" disabled>Clear</button>
        <button id="generate-pattern-btn" disabled>Generate search pattern</button>
      </div>
      <div class="mission-row">
        <label>AGL (m) <input type="number" id="mission-agl" value="60" min="1" step="1"></label>
        <label>Assumed max detection range (m) <input type="number" id="mission-range" value="100" min="1" step="1"></label>
        <label>Row spacing (m)
          <input type="number" id="mission-spacing" min="1" step="1">
          <button id="mission-spacing-auto" type="button" title="Recompute from altitude and detection range">Auto</button>
        </label>
      </div>
      <p class="muted" id="mission-status">Draw a search box on the map to begin.</p>
    </div>
  </div>
  <div id="table-panel">
    <p class="muted" id="freeze-banner" style="display:none">
      Editing this device's label — live updates are paused so your typing isn't disturbed.
    </p>
    <table>
      <thead>
        <tr>
          <th class="sortable" data-field="status">Status <span class="arrow"></span></th>
          <th class="sortable" data-field="device_name">Name <span class="arrow"></span></th>
          <th class="sortable" data-field="mac">MAC <span class="arrow"></span></th>
          <th class="sortable" data-field="rssi_dbm">RSSI <span class="arrow"></span></th>
          <th class="sortable" data-field="last_seen">Last seen <span class="arrow"></span></th>
          <th class="sortable" data-field="count">Count <span class="arrow"></span></th>
          <th class="sortable" data-field="label">Label <span class="arrow"></span></th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="device-rows"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none">No detections yet.</div>
  </div>
</main>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script>
let devices = [];
// The mac of the row whose label field currently has focus. While set, live
// websocket updates stop touching the DOM -- they still land in `devices`
// in the background -- so an in-progress edit doesn't get its focus/typing
// stolen by a re-render. Automatically released on blur. Rows are no longer
// freezable by clicking them: sorting now keeps row order stable on its
// own, and a click handler there would blow away in-progress text
// selection when copying a MAC/name out of the table.
let frozenMac = null;
let hasFitBounds = false;
// User-chosen sort column/direction, persisted across live updates so the
// table stops reordering itself out from under the user every poll tick.
// Defaults to the old "newest first" behavior until they click a header.
let sortField = 'last_seen';
let sortDir = 'desc';
// Set when a live update arrives while the user has text selected inside
// the table (e.g. mid drag-select to copy a MAC/name) so the rebuild that
// would otherwise wipe the selection is deferred until it clears -- no
// click/freeze needed, this is purely a "don't yank text out from under an
// active selection" guard.
let pendingRender = false;

function hasTableSelection() {
  const sel = window.getSelection();
  return !!sel && !sel.isCollapsed && rowsEl.contains(sel.anchorNode);
}

document.addEventListener('selectionchange', () => {
  if (pendingRender && !hasTableSelection()) {
    pendingRender = false;
    render();
  }
});

// --- Search grid (lawnmower pattern) planner state ---
// Detection footprint is modeled as a simple circle from free-space slant
// range: footprint_radius = sqrt(max_range^2 - agl^2). Row spacing defaults
// to a fraction of that footprint's diameter so adjacent passes overlap;
// OVERLAP_FACTOR trades search time against confidence of no gaps. Ignores
// the drone antenna's own radiation pattern (e.g. a whip's overhead null)
// -- a reasonable first-order default, not a physically exact model.
const OVERLAP_FACTOR = 0.8;
const METERS_PER_DEG_LAT = 111320;
const MAX_PATTERN_ROWS = 500; // safety cap so a tiny spacing can't hang the tab
let missionBoxBounds = null;
let missionBoxLayer = null;
let drawingBox = false;
let drawStart = null;
let spacingManuallySet = false;

const dot = document.getElementById('conn-dot');
const rowsEl = document.getElementById('device-rows');
const emptyEl = document.getElementById('empty-msg');
const captionEl = document.getElementById('map-caption');
const freezeBannerEl = document.getElementById('freeze-banner');
const filterNew = document.getElementById('filter-new');
const showHeatmap = document.getElementById('show-heatmap');
const searchInput = document.getElementById('search-input');
const drawBoxBtn = document.getElementById('draw-box-btn');
const clearBoxBtn = document.getElementById('clear-box-btn');
const generateBtn = document.getElementById('generate-pattern-btn');
const aglInput = document.getElementById('mission-agl');
const rangeInput = document.getElementById('mission-range');
const spacingInput = document.getElementById('mission-spacing');
const spacingAutoBtn = document.getElementById('mission-spacing-auto');
const missionStatusEl = document.getElementById('mission-status');

const map = L.map('map').setView([0, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);
const markerLayer = L.layerGroup().addTo(map);
const heatLayer = L.layerGroup();
const missionPatternLayer = L.layerGroup().addTo(map);

document.getElementById('night-toggle').addEventListener('click', () => {
  document.documentElement.classList.toggle('night');
});
filterNew.addEventListener('change', render);
showHeatmap.addEventListener('change', () => {
  if (showHeatmap.checked) heatLayer.addTo(map); else map.removeLayer(heatLayer);
  render();
});
let searchDebounce = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(render, 150);
});

function relTime(iso) {
  if (!iso) return '-';
  const then = new Date(iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z');
  const s = Math.max(0, (Date.now() - then.getTime()) / 1000);
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

async function tagDevice(mac, status, label) {
  await fetch(`/api/devices/${encodeURIComponent(mac)}/tag`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status, label }),
  });
}

function matchesSearch(d, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return (
    d.mac.toLowerCase().includes(q) ||
    (d.device_name && d.device_name.toLowerCase().includes(q)) ||
    (d.label && d.label.toLowerCase().includes(q)) ||
    (d.vendor_guess && d.vendor_guess.toLowerCase().includes(q))
  );
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function statusColor(status) {
  return cssVar(status === 'known' ? '--known' : status === 'ignore' ? '--ignore' : '--unknown');
}

function getVisibleDevices() {
  const onlyNew = filterNew.checked;
  const query = searchInput.value.trim();
  const filtered = devices.filter(d => (!onlyNew || d.status === 'unknown') && matchesSearch(d, query));
  return sortDevices(filtered);
}

function compareValues(a, b) {
  if (a == null && b == null) return 0;
  if (a == null) return -1;
  if (b == null) return 1;
  if (typeof a === 'string') return a.localeCompare(b);
  return a - b;
}

function sortDevices(list) {
  const field = sortField;
  const dir = sortDir === 'asc' ? 1 : -1;
  return [...list].sort((a, b) => {
    let av = a[field];
    let bv = b[field];
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    const cmp = compareValues(av, bv);
    // Stable tie-break on MAC so equal-value rows (e.g. same status) don't
    // jitter position between renders as unrelated fields update.
    return cmp !== 0 ? cmp * dir : compareValues(a.mac, b.mac);
  });
}

function setSort(field) {
  if (sortField === field) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortField = field;
    sortDir = 'asc';
  }
  render();
}

for (const th of document.querySelectorAll('th.sortable')) {
  th.addEventListener('click', () => setSort(th.dataset.field));
}

function updateSortIndicators() {
  for (const th of document.querySelectorAll('th.sortable')) {
    const arrow = th.querySelector('.arrow');
    arrow.textContent = th.dataset.field === sortField ? (sortDir === 'asc' ? '▲' : '▼') : '';
  }
}

async function bulkTag(status) {
  const visible = getVisibleDevices();
  if (visible.length === 0) return;
  if (!confirm(`Mark ${visible.length} currently visible device(s) as "${status}"?`)) return;
  await fetch('/api/devices/bulk_tag', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ macs: visible.map(d => d.mac), status }),
  });
}

document.getElementById('bulk-known').addEventListener('click', () => bulkTag('known'));
document.getElementById('bulk-ignore').addEventListener('click', () => bulkTag('ignore'));

document.getElementById('reset-db').addEventListener('click', async () => {
  if (!confirm('This permanently deletes ALL detections and tags. Reset the database?')) return;
  frozenMac = null;
  await fetch('/api/reset', { method: 'POST' });
});

function setFrozen(mac) {
  frozenMac = mac;
  freezeBannerEl.style.display = frozenMac ? 'block' : 'none';
}

function render() {
  const query = searchInput.value.trim();
  const visible = getVisibleDevices();

  emptyEl.style.display = devices.length === 0 ? 'block' : 'none';
  freezeBannerEl.style.display = frozenMac ? 'block' : 'none';
  updateSortIndicators();

  rowsEl.innerHTML = '';
  for (const d of visible) {
    const tr = document.createElement('tr');
    tr.className = d.status === 'unknown' ? 'row-unknown' : '';
    if (d.mac === frozenMac) tr.className += ' row-highlight';
    tr.dataset.mac = d.mac;

    const nameCell = d.device_name || '<span class="muted">(no name)</span>';
    const vendorBadge = d.vendor_guess
      ? `<span class="badge vendor ${d.vendor_confidence}" title="Fingerprint guess from BLE advertisement data -- not proof, and a rescuer's own device matches just as well as a missing person's">${d.vendor_guess}?</span>`
      : '';
    tr.innerHTML = `
      <td><span class="badge ${d.status}">${d.status}</span></td>
      <td>${nameCell} ${vendorBadge}</td>
      <td class="muted">${d.mac}</td>
      <td>${d.rssi_dbm ?? '-'}</td>
      <td>${relTime(d.last_seen)}</td>
      <td>${d.count}</td>
      <td><input type="text" value="${d.label ? d.label.replace(/"/g, '&quot;') : ''}" placeholder="label"></td>
      <td></td>
    `;

    const labelInput = tr.querySelector('input');
    // Focusing the field locks the view *without* triggering a render
    // (a render here would tear down and recreate this very input,
    // stealing back the focus we're trying to preserve). Blur releases the
    // lock automatically -- rows no longer need a manual click to
    // freeze/unfreeze now that sorting keeps row order stable, and a click
    // handler here would blow away in-progress text selection when copying
    // a MAC/name out of the table.
    labelInput.addEventListener('focus', () => setFrozen(d.mac));
    labelInput.addEventListener('blur', () => setFrozen(null));
    labelInput.addEventListener('change', () => tagDevice(d.mac, d.status, labelInput.value));

    const actionsCell = tr.querySelector('td:last-child');
    for (const status of ['known', 'unknown', 'ignore']) {
      const btn = document.createElement('button');
      btn.textContent = status;
      btn.style.marginRight = '4px';
      btn.style.opacity = d.status === status ? '1' : '0.5';
      btn.addEventListener('click', () => {
        tagDevice(d.mac, status, labelInput.value);
        d.status = status; // optimistic local update, shows immediately even while frozen
        render();
      });
      actionsCell.appendChild(btn);
    }

    rowsEl.appendChild(tr);
  }

  renderMap(visible, query);
  if (showHeatmap.checked) updateHeatmap(query);
}

function renderMap(visible, query) {
  const pts = visible.filter(d => d.lat != null && d.lon != null);
  markerLayer.clearLayers();

  captionEl.textContent = pts.length
    ? `${pts.length} positioned device(s)`
    : 'No GPS-tagged detections match the current view.';

  for (const p of pts) {
    const marker = L.circleMarker([p.lat, p.lon], {
      radius: p.mac === frozenMac ? 9 : 6,
      color: statusColor(p.status),
      fillColor: statusColor(p.status),
      fillOpacity: 0.85,
      weight: p.mac === frozenMac ? 3 : 1,
    });
    const vendorLine = p.vendor_guess ? `<br>possible: ${p.vendor_guess} (${p.vendor_confidence})` : '';
    marker.bindPopup(
      `<b>${p.device_name || '(no name)'}</b><br>${p.mac}<br>status: ${p.status}<br>rssi: ${p.rssi_dbm ?? '-'} dBm${vendorLine}`
    );
    marker.addTo(markerLayer);
  }

  if (!hasFitBounds && pts.length > 0) {
    const bounds = L.latLngBounds(pts.map(p => [p.lat, p.lon]));
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });
    hasFitBounds = true;
  }

  // A search that narrows to exactly one positioned device is almost
  // certainly "I know this MAC, take me there" -- pan to it without
  // fighting the initial auto-fit-bounds behavior above.
  if (query && pts.length === 1) {
    map.panTo([pts[0].lat, pts[0].lon]);
  }
}

async function updateHeatmap(query) {
  const url = query ? `/api/heatmap?mac=${encodeURIComponent(query)}` : '/api/heatmap';
  const resp = await fetch(url);
  const cells = await resp.json();
  heatLayer.clearLayers();
  if (cells.length === 0) return;
  const maxHits = Math.max(...cells.map(c => c.hits));
  for (const c of cells) {
    const t = maxHits > 1 ? (c.hits - 1) / (maxHits - 1) : 0;
    const hue = (1 - t) * 220; // blue (few hits) -> red (many hits)
    const radius = 6 + Math.min(18, Math.sqrt(c.hits) * 2.5);
    L.circleMarker([c.lat, c.lon], {
      radius,
      stroke: false,
      fillColor: `hsl(${hue}, 90%, 50%)`,
      fillOpacity: 0.45,
    }).bindTooltip(`${c.hits} hit(s)`).addTo(heatLayer);
  }
}

function metersPerDegLon(latDeg) {
  return METERS_PER_DEG_LAT * Math.cos(latDeg * Math.PI / 180);
}

function footprintRadius(aglM, rangeM) {
  const diffSq = rangeM * rangeM - aglM * aglM;
  return diffSq > 0 ? Math.sqrt(diffSq) : 0;
}

function computeDefaultSpacing(aglM, rangeM) {
  return 2 * OVERLAP_FACTOR * footprintRadius(aglM, rangeM);
}

function boxSizeMeters(bounds) {
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();
  const centerLat = (sw.lat + ne.lat) / 2;
  return {
    widthM: Math.abs(ne.lng - sw.lng) * metersPerDegLon(centerLat),
    heightM: Math.abs(ne.lat - sw.lat) * METERS_PER_DEG_LAT,
  };
}

// Boustrophedon ("lawnmower") coverage path for an axis-aligned box. Rows
// run along the box's longer edge (fewer, longer passes) and are spaced
// across the shorter edge; a quadcopter can reverse in place at each row
// end, so unlike fixed-wing survey planning there's no minimum turn radius
// to account for. Returns [[lat, lon], ...] in flight order, or null if
// spacing is too small for the box and would blow past MAX_PATTERN_ROWS.
function generateLawnmowerPattern(bounds, spacingM) {
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();
  const south = sw.lat, north = ne.lat, west = sw.lng, east = ne.lng;
  const centerLat = (south + north) / 2;
  const { widthM, heightM } = boxSizeMeters(bounds);

  const waypoints = [];
  if (widthM >= heightM) {
    const stepDeg = spacingM / METERS_PER_DEG_LAT;
    const rows = [];
    for (let lat = south; lat < north && rows.length < MAX_PATTERN_ROWS; lat += stepDeg) rows.push(lat);
    if (rows.length >= MAX_PATTERN_ROWS) return null;
    if (rows.length === 0 || rows[rows.length - 1] < north) rows.push(north);
    rows.forEach((rowLat, idx) => {
      const pair = idx % 2 === 0 ? [west, east] : [east, west];
      waypoints.push([rowLat, pair[0]], [rowLat, pair[1]]);
    });
  } else {
    const stepDeg = spacingM / metersPerDegLon(centerLat);
    const cols = [];
    for (let lon = west; lon < east && cols.length < MAX_PATTERN_ROWS; lon += stepDeg) cols.push(lon);
    if (cols.length >= MAX_PATTERN_ROWS) return null;
    if (cols.length === 0 || cols[cols.length - 1] < east) cols.push(east);
    cols.forEach((colLon, idx) => {
      const pair = idx % 2 === 0 ? [south, north] : [north, south];
      waypoints.push([pair[0], colLon], [pair[1], colLon]);
    });
  }
  return waypoints;
}

function haversineMeters([lat1, lon1], [lat2, lon2]) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function trackLengthMeters(waypoints) {
  let total = 0;
  for (let i = 1; i < waypoints.length; i++) total += haversineMeters(waypoints[i - 1], waypoints[i]);
  return total;
}

function drawPattern(waypoints) {
  missionPatternLayer.clearLayers();
  if (!waypoints || waypoints.length === 0) return;
  L.polyline(waypoints, { color: cssVar('--accent'), weight: 3, dashArray: '6 4' }).addTo(missionPatternLayer);
  L.circleMarker(waypoints[0], {
    radius: 5, color: cssVar('--known'), fillColor: cssVar('--known'), fillOpacity: 1,
  }).bindTooltip('Start').addTo(missionPatternLayer);
  L.circleMarker(waypoints[waypoints.length - 1], {
    radius: 5, color: cssVar('--unknown'), fillColor: cssVar('--unknown'), fillOpacity: 1,
  }).bindTooltip('End / RTL').addTo(missionPatternLayer);
}

function updateMissionStatus(waypoints) {
  if (!missionBoxBounds) {
    missionStatusEl.textContent = 'Draw a search box on the map to begin.';
    return;
  }
  const agl = parseFloat(aglInput.value) || 0;
  const range = parseFloat(rangeInput.value) || 0;
  if (agl >= range) {
    missionStatusEl.textContent =
      `Warning: ${agl}m AGL is at or beyond the assumed ${range}m detection range -- you likely won't detect anything at this altitude.`;
    return;
  }
  if (!waypoints) {
    missionStatusEl.textContent = 'Box ready -- click "Generate search pattern".';
    return;
  }
  if (waypoints === 'too-many-rows') {
    missionStatusEl.textContent = 'Row spacing is too small for this box -- increase spacing or shrink the box.';
    return;
  }
  const rows = Math.round(waypoints.length / 2);
  const lengthKm = (trackLengthMeters(waypoints) / 1000).toFixed(2);
  missionStatusEl.textContent = `${rows} row(s), ${waypoints.length} waypoints, ~${lengthKm} km track length.`;
}

function recomputeAutoSpacing() {
  if (spacingManuallySet) return;
  const agl = parseFloat(aglInput.value) || 0;
  const range = parseFloat(rangeInput.value) || 0;
  const computed = computeDefaultSpacing(agl, range);
  spacingInput.value = computed > 0 ? Math.round(computed) : '';
}

function onMissionParamsChanged() {
  missionPatternLayer.clearLayers();
  updateMissionStatus();
}

aglInput.addEventListener('input', () => {
  recomputeAutoSpacing();
  onMissionParamsChanged();
});
rangeInput.addEventListener('input', () => {
  recomputeAutoSpacing();
  onMissionParamsChanged();
});
spacingInput.addEventListener('input', () => {
  spacingManuallySet = true;
  onMissionParamsChanged();
});
spacingAutoBtn.addEventListener('click', () => {
  spacingManuallySet = false;
  recomputeAutoSpacing();
  onMissionParamsChanged();
});

drawBoxBtn.addEventListener('click', () => {
  if (drawingBox) {
    drawingBox = false;
    drawStart = null;
    map.dragging.enable();
    map.getContainer().style.cursor = '';
    drawBoxBtn.textContent = missionBoxBounds ? 'Redraw search box' : 'Draw search box';
    updateMissionStatus();
    return;
  }
  drawingBox = true;
  drawStart = null;
  drawBoxBtn.textContent = 'Cancel drawing';
  map.dragging.disable();
  map.getContainer().style.cursor = 'crosshair';
  missionStatusEl.textContent = 'Click and drag on the map to draw the search box.';
});

clearBoxBtn.addEventListener('click', () => {
  if (missionBoxLayer) { map.removeLayer(missionBoxLayer); missionBoxLayer = null; }
  missionBoxBounds = null;
  missionPatternLayer.clearLayers();
  generateBtn.disabled = true;
  clearBoxBtn.disabled = true;
  drawBoxBtn.textContent = 'Draw search box';
  updateMissionStatus();
});

generateBtn.addEventListener('click', () => {
  if (!missionBoxBounds) return;
  const spacing = parseFloat(spacingInput.value);
  if (!(spacing > 0)) {
    missionStatusEl.textContent = 'Row spacing must be greater than 0.';
    return;
  }
  const waypoints = generateLawnmowerPattern(missionBoxBounds, spacing);
  if (waypoints === null) {
    missionPatternLayer.clearLayers();
    updateMissionStatus('too-many-rows');
    return;
  }
  drawPattern(waypoints);
  updateMissionStatus(waypoints);
});

map.on('mousedown', (e) => {
  if (!drawingBox) return;
  drawStart = e.latlng;
  if (missionBoxLayer) { map.removeLayer(missionBoxLayer); missionBoxLayer = null; }
  missionBoxLayer = L.rectangle(L.latLngBounds(drawStart, drawStart), {
    color: cssVar('--accent'), weight: 2, fillOpacity: 0.08,
  }).addTo(map);
});

map.on('mousemove', (e) => {
  if (!drawingBox || !drawStart) return;
  missionBoxLayer.setBounds(L.latLngBounds(drawStart, e.latlng));
});

map.on('mouseup', (e) => {
  if (!drawingBox || !drawStart) return;
  const bounds = L.latLngBounds(drawStart, e.latlng);
  const { widthM, heightM } = boxSizeMeters(bounds);
  drawStart = null;
  if (widthM < 5 || heightM < 5) return; // too small to be a real drag -- keep drawing
  missionBoxLayer.setBounds(bounds);
  missionBoxBounds = bounds;
  drawingBox = false;
  map.dragging.enable();
  map.getContainer().style.cursor = '';
  drawBoxBtn.textContent = 'Redraw search box';
  clearBoxBtn.disabled = false;
  generateBtn.disabled = false;
  missionPatternLayer.clearLayers();
  updateMissionStatus();
});

recomputeAutoSpacing();

function connect() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(proto + location.host + '/ws');
  ws.onopen = () => dot.classList.add('connected');
  ws.onclose = () => { dot.classList.remove('connected'); setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'devices') {
      devices = msg.devices;
      if (msg.devices.length === 0) {
        // Only happens right after a reset -- nothing left to stay frozen on.
        hasFitBounds = false;
        setFrozen(null);
      }
      if (frozenMac !== null) {
        // state is current in `devices` already; the DOM just isn't
        // repainted until the label field blurs, so in-progress typing
        // doesn't get disturbed.
      } else if (hasTableSelection()) {
        pendingRender = true;
      } else {
        render();
      }
    }
  };
}

connect();
render();
</script>
</body>
</html>
